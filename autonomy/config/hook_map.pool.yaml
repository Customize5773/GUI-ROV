# Map kolam latihan terukur untuk lokalisasi X/Y dari hook kamera WALL.
pool:
  length_x: 4.4
  width_y: 2.2
  depth: 0.8

map:
  x_axis_heading_deg: 0.0

hooks:
  A:
    x: 2.2
    y: 0.0
    z: 0.385
    wall_heading_deg: 90.0
  B:
    x: 2.2
    y: 2.2
    z: 0.385
    wall_heading_deg: 270.0
  C:
    x: 4.4
    y: 1.1
    z: 0.385
    wall_heading_deg: 0.0
  D:
    x: 0.0
    y: 1.1
    z: 0.385
    wall_heading_deg: 180.0

trial_assignment:
  payload_id_to_hook_id: {}

camera_to_base:
  mount_roll_deg: 0.0
  mount_pitch_deg: 0.0
  mount_yaw_deg: 0.0
  offset_m: [0.07, 0.0, 0.03]
