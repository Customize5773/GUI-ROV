# config/rov_tuned.yaml — LAPISAN TUNING ROV (berpindah antar kolam)
#
# Isi file ini HANYA parameter yang tergantung pada ROV, kamera, dan air —
# BUKAN pada ukuran kolam. Karena itu nilai yang diasah saat trial di kolam
# 2,2 × 4,4 × 0,8 m dipakai APA ADANYA di kedua babak lomba (Trial 5×5 m,
# Running/final 10×10 m). Geometri tiap lokasi dipisah ke file tersendiri:
# config/pool_trial.yaml (latihan), config/pool_kki_trial.yaml (lomba 5×5 m),
# config/pool_kki_running.yaml (lomba 10×10 m).
#
# Pakai (file belakangan menang):
#   python fsm/mission5.py --config config/rov_tuned.yaml --config config/pool_trial.yaml
#   python fsm/mission5.py --config config/rov_tuned.yaml --config config/pool_kki_trial.yaml
#   python fsm/mission5.py --config config/rov_tuned.yaml --config config/pool_kki_running.yaml
#
# File ini DI-COMMIT (beda dgn *.local.yaml) — riwayat git-nya adalah catatan
# tuning antar trial, dan tools/analyze_run.py memakainya untuk mengaitkan skor
# tiap run ke nilai yang menghasilkannya.
#
# Nilai awal = default fsm/mission5.py. Perbarui setiap selesai sesi trial.

# ── Arah sumbu servo — hasil verifikasi kolam (VERIFIKASI_ARDUSUB.md) ─────────
# Sifat rangka & wiring thruster, sama di kolam mana pun. Balik bila error MEMBESAR.
invert:
  sway: false
  vert: false
  surge: false
  yaw: false

# ── Gain PID servo docking — IBVS (piksel, tanpa kalibrasi kamera) ────────────
pid_ibvs:
  kp_sway: 45.0
  kp_surge: 40.0
  kp_vert: 35.0

# ── Gain PID servo docking — PBVS (meter, kamera terkalibrasi) ────────────────
pid_pbvs:
  kp_sway: 140.0
  kp_surge: 140.0
  kp_vert: 110.0

# ── Target docking QR payload — geometri gripper & optik, bukan kolam ─────────
docking:
  qr_side_m: 0.04            # QR payload KKI 2026 = 4×4 cm (fisik, tetap)
  servo_target_area: 3000.0  # IBVS: luas QR (px²) saat jarak engage
  servo_target_dist: 0.30    # PBVS: jarak engage (m) — jangkauan gripper
  servo_kp_yaw: 0.0          # >0 → squaring tegak lurus dinding (aktifkan stlh verifikasi)
  lock_grace_t: 0.6          # detik hold saat QR dropout (riak air) sblm menyapu

# ── Docking ke HOOK (misi 3b HANG & misi 4 DOCK) ──────────────────────────────
hook_docking:
  target_area: 3000.0
  target_dist: 0.30
  lock_grace_t: 0.6
  acquire_t: 8.0
  # approach_speed TIDAK di sini — ruang pengereman tergantung ukuran kolam.

# ── Deteksi hook — sifat optik & pipa fisik ───────────────────────────────────
hook_detect:
  min_area: 150.0
  pipe_diam_m: 0.025         # ¾" PVC = 25 mm
  color_hsv_range: null      # isi HANYA stlh warna PVC & kontras dinding terukur

# ── Fase mekanis lepas payload ke hook (misi 3b) — detik ──────────────────────
hang:
  seat_t: 1.5
  open_t: 1.5
  back_t: 2.0

# ── Gerak mekanis lepas-hook (misi 5d) — geometri payload/hook, bukan kolam ───
m5_mechanics:
  engage_surge: 15
  unhook_vert: 30
  unhook_surge: -20
  unhook_lift_m: 0.12    # sementara; guidebook tidak memberi tinggi bukaan U
  unhook_lift_t: 3.0     # fallback tanpa feedback
  unhook_pull_t: 2.0

# ── Misi 5 autonomous dari sisi kiri ────────────────────────────────────────
# Baseline kode untuk dry-run/SITL; kalibrasikan pada jarak gripper nyata.
left_flow:
  # Langkah 1-2 diatur CUSTOM_CASES di rov_mission5_bridge.py, bukan di sini.
  advance_max_t: 15.0    # pagar JARAK maju buta (detik x SEARCH_SPEED); skala per arena
  align_t: 90.0       # approach jauh + align tip dipisah agar tetap lambat
  # Kolam uji berlatar putih dan hanya berisi hook. Gate bbox dibuat rendah
  # agar model yang belum sempurna tidak sering drop; keypoint kendali 2-5
  # tetap wajib lolos ambang 0.35 sebelum thruster boleh bergerak.
  yolo_conf: 0.10
  # Run 03:38: align LULUS di area 0.08-0.11 lalu QR_DOCK timeout. Foto CAM
  # BOTTOM menunjukkan QR payload memang ada tapi hanya ~60 px — terlalu kecil
  # untuk zbar di air keruh (butuh ~100-150 px). Target diperbesar supaya ROV
  # berhenti LEBIH DEKAT, sehingga QR cukup besar untuk di-decode.
  yolo_area_frac: 0.18   # UKUR: preflight_check.py --hook-model di jarak gripper
  hook_tip_x_frac: 0.5   # titik bidik ujung "J" thd bbox: 0=kiri, 1=kanan
  hook_tip_y_frac: 0.9   # 0=atas, 1=bawah — ujung J ada di sisi BAWAH
  # Uji 5 Sep: pada kp 20 / cap 8 perintah yaw hanya ~4,5% dan ROV berputar
  # 0,075 derajat/detik — butuh >90 s untuk 7 derajat, jauh melewati align_t.
  # Dinaikkan agar konvergen dalam jendela waktu; tetap di bawah 30%.
  # kp 20 terlalu lemah (tak konvergen), kp 45 overshoot -107 -> +180 px.
  hook_yaw_kp: 28.0      # point 5 kanan/kiri → arahkan hidung secara proporsional
  hook_max_yaw: 20.0     # yaw approach dibatasi agar tidak menyentak
  qr_yaw_kp: 20.0
  qr_yaw_kp_deg: 1.0     # yaw dari kemiringan QR (PBVS); qr_yaw_kp hanya utk IBVS
  qr_yaw_tol_deg: 8.0
  qr_max_yaw: 20.0
  grip_t: 2.0
  # Approach visual dibuat lambat; cap berlaku sesudah PID sehingga lonjakan
  # confidence/error satu frame tidak langsung menjadi dorongan besar.
  # Uji kolam: 12% tidak mengubah luas bbox; 30% adalah breakaway trial,
  # tetap dicapai perlahan oleh visual_slew 10%/detik.
  visual_max_surge: 30.0
  # Run 03:31: sway MENTOK di 12% sepanjang align sementara tip_x melenceng
  # -107 -> +180 px. Menyejajarkan badan ke depan hook butuh translasi lateral,
  # bukan cuma memutar hidung; cap dinaikkan (tetap < 30%).
  visual_max_sway: 20.0
  visual_max_yaw: 25.0
  # Vertikal perlu melewati deadband/breakaway ketika ROV mulai dari dasar.
  # Cap sedikit lebih tinggi, tetapi ramp diperlambat agar tidak menyentak.
  visual_max_vert: 20.0
  visual_slew: 10.0

# ── Toleransi kontrol kedalaman — sifat sensor & kontroler ────────────────────
depth:
  tolerance: 0.05
  target_surface: 0.05
  # Uji 5 Sep: dgn HOOK_DEPTH 0.45 m ROV menahan 0.48-0.50 m dan hook selalu
  # TERPOTONG di tepi ATAS frame (bbox y=0, offset_y ~ -300 px) sehingga
  # confidence jatuh ke 0.13-0.30 dan align tak pernah konvergen. Offset 300 px
  # pada FOV vertikal ~33 derajat ≈ 14 derajat; pada jarak ~1,2 m itu ≈ 0,29 m
  # di ATAS kamera. Target dinaikkan agar hook masuk ke tengah bidang pandang.
  # Run 03:31: pada depth 0.28-0.30 m tip_y_offset ≈ -22..+10 px (TEPAT center),
  # jadi 0.22 m terlalu dangkal dan membuat hook lewat di bawah tengah frame.
  # Alur penuh 3-8: 0,30 m menempatkan hook di TENGAH bidang pandang CAM WALL
  # (pada 0,45 m hook terpotong di tepi atas, confidence jatuh ke 0,13-0,30).
  # Catatan uji 6-8 terisolasi: bila operator menempatkan ROV jauh di bawah
  # nilai ini, _left_hold memanjat 60% dan ROV melesat sebelum menggenggam —
  # samakan hook_depth dgn kedalaman penempatan saat menguji tahap 6-8 saja.
  hook_depth: 0.30

# ── Batas waktu ───────────────────────────────────────────────────────────────
timeouts:
  # Run 03:38: QR_DOCK habis waktu 25 s sebelum QR sempat ter-decode. Dgn
  # pendekatan yang kini lebih rapat, beri jendela lebih panjang untuk lock.
  m5_dock: 45.0

# ── Validasi payload QR ───────────────────────────────────────────────────────
payload:
  mission: 5
  type: payload
