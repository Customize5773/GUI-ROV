# systemd drop-in: rov-vision-qr.service.d/wall-camera.conf
[Unit]
Description=ROV Vision Worker - CAM WALL (QR gripper)
After=ustreamer-cam1.service

[Service]
ExecStart=
ExecStart=/home/hydroships/rov-agent/.venv/bin/python tools/qr_vision_worker.py --camera http://127.0.0.1:8080/stream --camera-role WALL --model vision/best_new_320.onnx --imgsz 320 --calib vision/calibration/wall.npz --conf 0.6 --emit-udp 127.0.0.1:14550 --telemetry-port 14557 --cv-threads 2 --fps 4
