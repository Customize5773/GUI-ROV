# Tuning servo hook untuk CASE 4 di control_main.py.
#
# SEMUA nilai di sini BELUM TERVALIDASI HARDWARE. Angkanya disalin dari
# konstanta servo docking yang sudah ada di autonomy/fsm/mission5.py (IBVS_KP_SWAY,
# SERVO_KD_IBVS, SERVO_SLEW, SERVO_DEADBAND_NORM, VisualServo.tol_norm/max_speed)
# supaya titik awalnya bukan tebakan kosong — TAPI konteksnya berbeda (kamera,
# jarak, dan di sini cuma satu axis yang aktif), jadi perlakukan sebagai
# placeholder sampai diukur di kolam.
#
# File ini dibaca ulang SETIAP KALI mode autonomous dinyalakan: edit yaml,
# toggle mode di GUI, tanpa restart server dan tanpa redeploy apa pun ke Pi.

# >>> PENGATURAN KOREKSI SWAY: kp_sway, kd_sway, dan max_speed di bagian ini.
servo_hook:
  # Satu profil untuk kontrol dan visual; nilai geometri ditimpa profil ini.
  calibration_file: ../shared/grab-calibration.json

  # ── SUMBER ACUAN LATERAL ───────────────────────────────────────────────
  #   qr   -> best_new @ CAM WALL, KOTAK QR payload. Dipakai CASE 4.
  #           Menerima DUA kanal sekaligus:
  #             `qr_vision` QR berhasil di-decode
  #             `qr_region` kotak terdeteksi, decode GAGAL
  #           Worker mengirim salah satu per frame, tak pernah keduanya.
  #           Menengahkan kotak tidak butuh tahu isi QR-nya, sedangkan decode
  #           adalah bagian yang paling sering gagal di air berriak — jadi
  #           servo tetap punya acuan justru saat air paling keruh.
  #   hook -> best_pose.pt @ CAM WALL, hook candy-cane (`hook_xy`).
  source: qr
  # Nilai cadangan berikut hanya berlaku jika calibration_file dilepas.
  # Saat profil aktif, target X, ROI dan ambang luas berasal dari JSON bersama.
  target_x_norm: 0.475
  # Area TANGKAP, bukan ROI pencarian YOLO. [x1,y1,x2,y2] / ukuran frame.
  # Tanpa profil, null memblokir grab otomatis.
  grab_roi_norm: null

  # ── ARAH — VERIFIKASI DULU SEBELUM MENYENTUH ANGKA LAIN ────────────────
  # Kalau tandanya terbalik, gejalanya BUKAN "koreksi kurang kuat": ROV akan
  # menjauh dari hook makin cepat, dan itu terlihat persis seperti kp_sway
  # kebesaran. Menurunkan kp hanya memperlambat kegagalan yang sama.
  # Cek arah lewat panel Thruster Test di halaman Setup SEBELUM tuning angka.
  # Preseden: joystick.py sengaja membalik surge (SURGE_MIN=1000/MAX=-1000),
  # jadi sway berisiko sama.
  invert_sway: false

  # ── Gain & peredam ─────────────────────────────────────────────────────
  # Frame 3-2-1: cuma SATU thruster sway. Otoritas lateral lemah, jadi menaikkan
  # kp tidak menghasilkan koreksi lebih cepat — ia cuma menyaturasi satu-satunya
  # thruster yang ada, sambil menambah roll.
  kp_sway: 45.0          # % command per 1.0 error ternormalisasi
  kd_sway: 6.0           # redam overshoot; error visual berisik, D wajib difilter
  d_lpf: 0.4             # 0..1, kecil = lebih halus & lebih lambat
  deadband_norm: 0.02    # |ex| di bawah ini = 0; riak menggeser centroid bbrp px

  # Sway menimbulkan roll secara mekanik (asimetri terukur 7,1:1, ROV diam
  # miring ~-2°). Roll memiringkan kamera -> error visual melompat -> servo
  # mengejar bayangannya sendiri. slew memutus umpan balik itu; ini pagar
  # keselamatan loop, bukan sekadar knob kenyamanan. Naikkan pelan-pelan.
  slew: 120.0            # %/detik batas laju perubahan command
  max_speed: 35.0        # batas command (%) sebelum diskalakan ke ±1000

  # ── Ambang tengah ──────────────────────────────────────────────────────
  # center_tol_norm membuka gate surge; close juga wajib melewati ambang area.
  # 0.08 = 8% setengah-lebar frame.
  center_tol_norm: 0.08
  # Jumlah deteksi BARU beruntun: centered, masuk area XY, luas cukup.
  # 10 frame pada 10 FPS sekitar 1 detik; cache tidak menambah hitungan.
  centered_ticks: 10

  # ── Umur deteksi ───────────────────────────────────────────────────────
  # Sama dengan HOOK_VISION_MAX_AGE di rov_agent.py. Lebih tua dari ini =
  # sway NOL. Tidak ada sensor posisi lateral sama sekali di ROV ini: kalau
  # deteksi hilang, tak ada satu pun cara mengetahui ROV sudah bergeser berapa,
  # jadi menebak dari error terakhir = menggerakkan wahana secara buta.
  max_age: 1.0

  # Nilai cadangan tanpa profil: null = tidak boleh close.
  # Decoded: contourArea empat sudut. Region: luas bbox YOLO (lebih besar).
  # Log [SERVO] mencetak channel dan area_frac untuk kalibrasi terpisah.
  close_area_frac_decoded: null
  close_area_frac_region: null

# >>> PENGATURAN GERAK FULL COUNTER: ubah nilai di bawah ini.
# Dimuat ulang saat mode autonomous dinyalakan.
mission:
  # CASE 0: waktu diam awal (detik); semua command sumbu nol.
  settle_s: 3.0
  # CASE 1: target kedalaman absolut via depth_apply, bukan command heave langsung.
  depth_m: 1.0          # <<< TARGET KEDALAMAN (meter)
  # CASE 1: batas waktu menunggu kedalaman (detik); habis waktu juga lanjut.
  depth_wait_s: 3.0
  # CASE 1: lanjut lebih awal jika selisih kedalaman kurang dari nilai ini (meter).
  depth_tol_m: 0.1
  # CASE 2: batas pencarian (detik); tanpa deteksi sampai batas ini, misi dihentikan.
  search_timeout_s: 8.0
  # Command ±1000, placeholder pelan: wajib trial kolam. Search TANPA sway.
  # CASE 2: besar command putar, bukan derajat/detik; tanda dibalik tiap search_sweep_s.
  search_yaw: 100       # <<< YAW SAAT MENCARI (-1000..1000; arah bergantian)
  # CASE 2: command maju/mundur saat mencari; sway tetap nol. Ikuti CONTROL-MAPPING.md untuk arah fisik.
  search_surge: -100    # <<< SURGE SAAT MENCARI (-1000..1000)
  # CASE 2: interval pembalikan arah yaw (detik), bukan durasi seluruh pencarian.
  search_sweep_s: 2.0
  # CASE 4: command mendekat hanya saat target cukup tengah; perubahan dibatasi slew.
  approach_surge: -100  # <<< SURGE MENDEKATI TARGET (-1000..1000)
  # 10 pengamatan pada 4 FPS ~2.5 s; sediakan waktu masuk area + satu retry.
  # CASE 4: batas waktu koreksi visual (detik); timeout menghentikan misi.
  servo_timeout_s: 6.0
  # CASE 4: batas umur acuan visual untuk menghentikan misi (detik); max_age menghentikan gerak lebih awal.
  lost_timeout_s: 10.0
  # CASE 5: waktu tunggu setelah perintah close (detik); bukan konfirmasi benda sudah tergenggam.
  gripper_hold_s: 1.5
  # CASE 6: target = max(0, kedalaman saat itu - rise_m), dikirim melalui depth_apply.
  rise_m: 0.5           # <<< JARAK NAIK SETELAH GRIPPER (meter)
  # CASE 6: waktu tunggu naik (detik); setelah selesai target kedalaman tetap aktif.
  rise_wait_s: 3.0
  # Batas usia telemetri yang dianggap segar (detik) untuk pemeriksaan misi.
  telemetry_max_age: 1.0
